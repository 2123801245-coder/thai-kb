<style>

  a{display:inline-block; margin-top:14px; padding:11px 16px; border:2px solid #241b12;
    background:#241b12; color:#fdf6e6; text-decoration:none; font-size:14px; font-weight:800;
    box-shadow:3px 3px 0 #e3a72f;}
